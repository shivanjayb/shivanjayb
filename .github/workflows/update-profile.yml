name: Update Profile Art

on:
  # Runs every day at 00:30 UTC (06:00 IST) — refreshes the heatmap automatically
  schedule:
    - cron: "30 0 * * *"

  # Runs instantly whenever you push to main
  push:
    branches:
      - main

  # Also lets you trigger it manually from GitHub's Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the regenerated SVGs back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Step 1 — fetch your latest GitHub contribution data
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: shivanjayb
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2 — regenerate the heatmap SVG from the fresh data
      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      # Step 3 — regenerate the info card SVG
      - name: Render info card SVG
        run: python scripts/make_info_card.py

      # Step 4 — if anything changed, commit and push the new SVGs back
      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg info-card.svg data/contributions.json
          git diff --cached --quiet || git commit -m "chore(bot): refresh profile art [skip ci]"
          git push
